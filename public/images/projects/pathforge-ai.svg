<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="50%" stop-color="#0f111c"/>
      <stop offset="100%" stop-color="#181426"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="600" cy="220" r="380" fill="url(#glow)"/>

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="595" rx="28" fill="rgba(15, 17, 28, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Header Category Pill -->
  <g transform="translate(80, 80)">
    <rect width="150" height="34" rx="17" fill="url(#brandGrad)" opacity="0.2"/>
    <rect width="150" height="34" rx="17" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <text x="75" y="22" fill="#a78bfa" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">LIVE PROJECT</text>
  </g>

  <!-- Title Icon & Name -->
  <g transform="translate(80, 240)">
    <circle cx="50" cy="0" r="50" fill="url(#brandGrad)" opacity="0.2"/>
    <circle cx="50" cy="0" r="48" fill="#141727" stroke="#a78bfa" stroke-width="2"/>
    <text x="50" y="14" font-size="44" text-anchor="middle">🌐</text>
    <text x="130" y="16" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">PathForge AI</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="340" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="400">
    Interactive 3D Route & Spatial Planning Visualizer
  </text>

  <!-- Tech Badges -->
  <g transform="translate(-80, -70)">
    
    <g transform="translate(160, 510)">
      <rect width="140" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">React</text>
    </g>
  
    <g transform="translate(320, 510)">
      <rect width="140" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Vite</text>
    </g>
  
    <g transform="translate(480, 510)">
      <rect width="140" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Tailwind CSS</text>
    </g>
  
    <g transform="translate(640, 510)">
      <rect width="140" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Three.js</text>
    </g>
  
  </g>

  <!-- Bottom Accent Line -->
  <rect x="80" y="580" width="1040" height="3" rx="1.5" fill="url(#brandGrad)"/>
</svg>